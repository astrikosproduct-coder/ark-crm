# ARK CRM — the whole application: database, backend, and the web server in
# front of both. The same file runs on an on-prem server, a cloud VM, or a
# laptop; only .env differs. See DEPLOY.md.
#
#     cp .env.example .env      # then fill it in
#     docker compose up -d --build
#
# Project name "ark-crm", deliberately NOT "ark": the development database on
# the build laptop is compose project "ark" (container ark-postgres, volume
# ark_ark_postgres_data). A different name gives this stack its own volume, so
# starting it anywhere can never attach to — or corrupt — that database.

name: ark-crm

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ark_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the backend reaches the database, over the
    # stack's private network. Nothing outside the server can connect to it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ark_crm}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in .env}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID in .env}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env — see .env.example}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-true}
    depends_on:
      db:
        condition: service_healthy
    # No published port either: Caddy forwards /api to it.

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Caddy keeps its certificates here; losing them means re-issuing.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
